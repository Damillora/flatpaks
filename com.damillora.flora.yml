id: com.damillora.flora
runtime: org.kde.Platform
runtime-version: "6.11"
base: org.winehq.Wine
base-version: stable-25.08
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: flora-desktop
desktop-file-name-suffix: " (Nightly)"
finish-args:
  - "--allow=devel"
  - "--allow=multiarch"
  - "--allow=bluetooth"
  - "--allow=per-app-dev-shm"
  - "--device=all"
  - "--share=ipc"
  - "--share=network"
  - "--socket=pulseaudio"
  - "--socket=x11"
  - "--socket=wayland"
  - --persist=.
  - --talk-name=org.kde.StatusNotifierWatcher # system tray
  - --own-name=com.steampowered.* # run multiple games in the same prefix
  - --system-talk-name=org.freedesktop.UDisks2
  - --filesystem=/run/media
inherit-extensions:
  - org.freedesktop.Platform.GL32
  - org.freedesktop.Platform.Compat.i386
add-extensions:
  org.freedesktop.Platform.VAAPI.Intel.i386:
    directory: lib/i386-linux-gnu/dri/intel-vaapi-driver
    version: 25.08
    versions: 25.08
    autodelete: false
    no-autodownload: true
    add-ld-path: lib
    download-if: have-intel-gpu
    autoprune-unless: have-intel-gpu
modules:
  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/i386-linux-gnu
      - mkdir -p /app/lib/debug/lib/i386-linux-gnu
      - mkdir -p /app/lib/i386-linux-gnu/GL
      - mkdir -p /app/lib/i386-linux-gnu/dri/intel-vaapi-driver
      - install -Dm644 ld.so.conf /app/etc/ld.so.conf
    sources:
      - type: inline
        dest-filename: ld.so.conf
        contents: |
          /app/lib32
          /app/lib/i386-linux-gnu
  - name: winetricks
    buildsystem: simple
    build-commands:
      - install -Dm0755 src/winetricks ${FLATPAK_DEST}/bin/winetricks
    sources:
      - type: git
        url: https://github.com/winetricks/winetricks.git
        tag: 20260125
  - name: flora-server
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/flora/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - install -Dm0644 cargo/config .cargo/config.toml
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --all-features
      - install -Dm0755 target/release/flora_server ${FLATPAK_DEST}/bin/flora_server
      - install -Dm0755 target/release/flora ${FLATPAK_DEST}/bin/flora
    sources:
      - type: git
        url: https://github.com/Damillora/flora.git
        branch: main
      - cargo-sources.json
  - name: flora-desktop
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://git.nanao.moe/Damillora/flora-desktop.git
        branch: main
